---
# The Buildkite controller at the same priority as Kueue and JobSet's, so
# kube-dns, which GKE grows with the node count, cannot preempt it off a full
# node. It stays at one replica: two replicas share one controller ID, and two
# controllers with one ID can each reserve the same job.
#
# A partial object, applied after the chart under the controller field manager
# (see deploy_manifests.py): the chart has no priorityClassName value, and
# applying it as the chart's own field manager would strip what the chart set.
#
# GKE admits pods at system-cluster-critical only in a namespace whose
# ResourceQuota names that class. Scoped to the class, it counts the controller
# and nothing else in this namespace: three pods, the replica, a rollout's surge
# pod and one spare.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: critical-pods
  namespace: buildkite
spec:
  hard:
    pods: "3"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: ["system-cluster-critical"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-stack-k8s
  namespace: buildkite
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
