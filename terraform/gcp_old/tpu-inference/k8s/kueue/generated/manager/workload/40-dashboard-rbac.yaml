---
# What the health dashboard may read on the manager - see dashboard.tf and
# dashboard/app.py. It arrives through Connect Gateway as its Google service
# account, so the subject is that account's email; IAM only lets it through the
# gateway, and these rules are all it can do once inside.
#
# Read-only, and only what the page reports: the queues, their quota and the
# worker connections; the workloads waiting on them, and the Jobs and JobSets
# the launcher labels with the Buildkite build each belongs to; the agent pods,
# for ones the manager cannot schedule; and events. No logs, no secrets, no
# writes. Workloads, Jobs and pods carry a step's pod template, so this does
# read the environment a step was given; the page shows none of it, and IAP is
# the only way to the page.
#
# Queues, worker connections and admission checks are cluster-scoped, hence the
# ClusterRole; the rest is granted in the one namespace the fleet runs in.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tpu-ci-dashboard
rules:
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues", "cohorts", "multikueueclusters", "admissionchecks"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tpu-ci-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tpu-ci-dashboard
subjects:
  - kind: User
    name: tpu-ci-dashboard@cloud-ullm-inference-ci-cd.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpu-ci-dashboard
  namespace: buildkite
rules:
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues", "workloads"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpu-ci-dashboard
  namespace: buildkite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpu-ci-dashboard
subjects:
  - kind: User
    name: tpu-ci-dashboard@cloud-ullm-inference-ci-cd.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
