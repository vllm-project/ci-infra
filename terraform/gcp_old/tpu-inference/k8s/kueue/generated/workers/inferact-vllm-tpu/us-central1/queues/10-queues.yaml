# One flavor per TPU generation, and no nodeLabels that tell its shapes apart.
#
# The flavor, not the queue, is Kueue's quota partition, and Kueue skips a
# flavor whose nodeLabels conflict with what a podSet asks for. A flavor per
# shape would therefore stop a 1-chip job borrowing idle 8-chip capacity,
# whatever the numbers said. Placement is the workload's anyway: it carries the
# TPU nodeSelectors itself.
#
# A generation with Spot names how its reserved nodes are provisioned,
# gke-provisioning=standard, where a Spot node says spot: the key the launcher
# pins a workload to Spot with, since Kueue ignores affinity on keys a flavor
# does not define (reserved_flavor_labels in generate_manifests.py).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x
---
# One queue per TPU shape, all of a generation's queues in one cohort, so that
# nominalQuota is chips this shape can always have and no other shape can hold
# the reservation against it, while whatever it is not using is lent out.
#
# reclaimWithinCohort is Never unless prod.auto.tfvars sets it: eviction returns
# the accounting at once but not the hardware, since eight chips freed across
# eight single-chip nodes still have to scale down before an 8-chip node can
# boot, and the jobs killed to get there have to run again. The multi-host
# shapes reclaim anyway, since without it they wait for a whole slice to free.
# withinClusterQueue stays Never: priority decides who goes next, not who stops.
#
# queueingStrategy is BestEffortFIFO unless prod.auto.tfvars sets it: a
# workload that does not fit is passed over for a smaller one behind it. In a
# queue that mixes sizes the large ones can wait for hours, since chips free
# up one small workload at a time and are taken before enough are free at
# once. StrictFIFO admits nothing behind a head that does not fit, so within a
# priority the queue runs in order. In Kueue v0.20.1 a strict head that fits
# only by preemption, with nothing it may preempt, also reserves its request in
# every scheduling cycle unless reclaimWithinCohort is Any, so the cohort's
# other queues never see the chips it is waiting for and starve while it
# borrows. Only the manager orders the queue: a worker
# runs what the manager dispatched, and a strict head there that disagrees with
# the manager about usage would block everything dispatched after it.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu7x-standard-1t-1x1x1
spec:
  cohortName: tpu7x
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: buildkite
  resourceGroups:
    # One resource under quota: google.com/tpu for a TPU shape, cpu for the cpu
    # queue (see CPU_QUEUE_RESOURCE in generate_manifests.py). Everything else a pod
    # requests is left to the kube scheduler. See quotaCheckStrategy in
    # common-config.yaml.
    - coveredResources:
        - google.com/tpu
      flavors:
        - name: tpu7x
          resources:
            - name: google.com/tpu
              # Chips, not nodes. This is a ceiling on what Kueue will admit at
              # once, not a promise that a slice of the right shape is free.
              nominalQuota: 0
              borrowingLimit: 4
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu7x-standard-1t-1x1x1
  namespace: buildkite
spec:
  clusterQueue: tpu7x-standard-1t-1x1x1
---
