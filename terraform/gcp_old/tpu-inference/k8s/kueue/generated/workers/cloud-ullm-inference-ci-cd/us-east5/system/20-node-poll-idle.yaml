# tree that does not match.
---
# Keeps the CPUs of the v6e one-chip nodes out of deep idle states, as bare
# metal's TPU VMs are by booting with idle=poll.
#
# The GKE node image idles these CPUs through acpi_idle, which halts them, and
# waking a halted CPU is what a serving loop does thousands of times a second:
# the API server, the engine core and the runtime hand every request between
# threads and processes. Kube runs Qwen2.5-VL-7B's multimodal benchmark ~22%
# slower than bare metal even on a warm pod (v6e, 1.39 vs 1.80 req/s) with the
# TPU mostly idle. GKE does not take kernel arguments, so this disables every
# cpuidle state but POLL at runtime, which is what idle=poll leaves.
#
# Not on v7x: its nodes register no cpuidle driver, so there is no state to
# disable and the CPUs halt in the kernel's default idle loop.
#
# One pool first, so the effect can be measured before it spreads. Removing the
# DaemonSet restores the idle states on the nodes it ran on.
#
# Requests stay token: a daemon pod counts against the node the autoscaler
# simulates, and too large a request stops a TPU pool scaling up from zero.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tpu-node-poll-idle
  namespace: kube-system
  labels:
    app: tpu-node-poll-idle
spec:
  selector:
    matchLabels:
      app: tpu-node-poll-idle
  template:
    metadata:
      labels:
        app: tpu-node-poll-idle
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 1x1
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 10
      containers:
      - name: poll-idle
        image: mirror.gcr.io/library/busybox:1.36
        # Writing to /sys needs a privileged container.
        securityContext:
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          states=/sys/devices/system/cpu/cpu*/cpuidle/state*
          set_deep() {
            for s in $states; do
              if [ "$(cat "$s/name")" != POLL ]; then echo "$1" > "$s/disable"; fi
            done
          }
          restore() { set_deep 0; echo "deep idle states restored"; exit 0; }
          trap restore TERM INT
          cat /sys/devices/system/cpu/cpuidle/current_driver
          # Again every minute, for a CPU brought online since.
          while true; do
            set_deep 1
            sleep 60 &
            wait $!
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
