kind: Role
metadata:
  name: tpu-ci-dashboard
  namespace: buildkite
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpu-ci-dashboard
  namespace: buildkite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpu-ci-dashboard
subjects:
  - kind: User
    name: tpu-ci-dashboard@cloud-ullm-inference-ci-cd.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
