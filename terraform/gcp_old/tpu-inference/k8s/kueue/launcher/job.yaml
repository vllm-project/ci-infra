# The Job a step gets when it names hardware and nothing else: one pod on one
# host, holding every chip on the node. Everything in it is a fact about the
# cluster, which is why it lives here and not in the repo being tested; the
# step supplies the command and the shape, the launcher fills in the name,
# queue, deadline and cache sizes.
#
# A workload this cannot express - roles that talk to each other, hosts of one
# slice - is a JobSet the calling repo passes as --manifest.
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # The fleet's caches, gcsfuse settings and eviction policy, from
    # pod_defaults.yaml. This Job takes them the same way a repo's own manifest
    # does, so there is one definition rather than one here and one there.
    tpu-ci.google.com/defaults: standard
spec:
  parallelism: 1
  completions: 1
  # For the case the rules below cannot name: a TPU node repaired underneath a
  # running pod is rejected at kubelet admission - `no healthy devices present;
  # cannot allocate unhealthy devices google.com/tpu` - with no
  # DisruptionTarget condition and no exit code, because nothing started.
  #
  # Six is a little over ten minutes of exponential backoff, which outlasts a
  # repair. It never reruns a red test: FailJob below ends the Job on the first
  # non-zero exit however many retries remain.
  backoffLimit: 6
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailJob
        onExitCodes:
          containerName: workload
          operator: NotIn
          values: [0]
  template:
    spec:
      restartPolicy: Never
      # The identity the cache buckets authorise; see workload_sa.yaml.tpl for
      # why it is not `default`.
      serviceAccountName: tpu-workload
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: ${ACCELERATOR_LABEL}
        cloud.google.com/gke-tpu-topology: ${TOPOLOGY}
      tolerations:
        - key: "google.com/tpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      containers:
        - name: workload
          image: ${IMAGE}
          # No workingDir: the image's own is where its tests live, and this
          # file is not the place to know that.
          command: ["/bin/bash", "-lc"]
          env:
            # Only what is the same for every test; the rest arrives through
            # `--env`, which can leave a name the step did not set unset.
            - name: HF_HOME
              value: /cache/hf
            # Unbuffered, so output reaches the log as it happens.
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            limits:
              google.com/tpu: "${CHIPS}"
            requests:
              google.com/tpu: "${CHIPS}"
              # Keeps the pod out of BestEffort, which is evicted first: it
              # holds a tmpfs /dev/shm and a memory-backed file cache, and
              # eviction ranks pods by usage above request. Sized from those
              # volumes by memory_request() in generate_manifests.py.
              #
              # No CPU request: it is also a scheduling floor, checked against
              # a template the autoscaler builds for the shape, and one large
              # enough to matter can exceed what that template offers - which
              # stops the pool building nodes at all.
              memory: "${MEMORY_REQUEST}"
