# The Job a step gets when it names hardware and nothing else: one pod on one
# host, holding every chip on the node. Everything in it is a fact about the
# cluster, which is why it lives here and not in the repo being tested; the
# step supplies the command and the shape, the launcher fills in the name,
# queue, deadline and cache sizes.
#
# A workload this cannot express - roles that talk to each other, hosts of one
# slice - is a JobSet the calling repo passes as --manifest.
apiVersion: batch/v1
kind: Job
spec:
  parallelism: 1
  completions: 1
  # For the case the rules below cannot name: a TPU node repaired underneath a
  # running pod is rejected at kubelet admission - `no healthy devices present;
  # cannot allocate unhealthy devices google.com/tpu` - with no
  # DisruptionTarget condition and no exit code, because nothing started.
  #
  # Six is a little over ten minutes of exponential backoff, which outlasts a
  # repair. It never reruns a red test: FailJob below ends the Job on the first
  # non-zero exit however many retries remain.
  backoffLimit: 6
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailJob
        onExitCodes:
          containerName: workload
          operator: NotIn
          values: [0]
  template:
    metadata:
      annotations:
        # Without this GKE does not inject the sidecar and the csi volumes
        # below never mount.
        gke-gcsfuse/volumes: "true"
        # Job pods are evictable by default, so the last long step of a build
        # is a lone pod on an idle node - what OPTIMIZE_UTILIZATION
        # consolidates away. It presents as a job that vanished.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        # Headroom for metadata prefetch on both mounts. GKE's guidance is
        # 512Mi or higher; 2Gi because the compilation cache prefix holds tens
        # of thousands of entries and a prefetch that runs out of memory falls
        # back to a lookup per miss.
        gke-gcsfuse/metadata-prefetch-memory-limit: "2Gi"
        # Unlimited sidecar CPU and memory: parallel downloads are CPU-bound
        # and the defaults throttle them. Standard clusters only.
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
    spec:
      restartPolicy: Never
      # The identity the cache buckets authorise; see workload_sa.yaml.tpl for
      # why it is not `default`.
      serviceAccountName: tpu-workload
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: ${ACCELERATOR_LABEL}
        cloud.google.com/gke-tpu-topology: ${TOPOLOGY}
      tolerations:
        - key: "google.com/tpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      containers:
        - name: workload
          image: ${IMAGE}
          # No workingDir: the image's own is where its tests live, and this
          # file is not the place to know that.
          command: ["/bin/bash", "-lc"]
          env:
            # Only what is the same for every test; the rest arrives through
            # `--env`, which can leave a name the step did not set unset.
            - name: HF_HOME
              value: /cache/hf
            # Unbuffered, so output reaches the log as it happens.
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            limits:
              google.com/tpu: "${CHIPS}"
            requests:
              google.com/tpu: "${CHIPS}"
              # Keeps the pod out of BestEffort, which is evicted first: it
              # holds a tmpfs /dev/shm and a memory-backed file cache, and
              # eviction ranks pods by usage above request. Sized from those
              # volumes by memory_request() in generate_manifests.py.
              #
              # No CPU request: it is also a scheduling floor, checked against
              # a template the autoscaler builds for the shape, and one large
              # enough to matter can exceed what that template offers - which
              # stops the pool building nodes at all.
              memory: "${MEMORY_REQUEST}"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            # Mounted for every workload, pointed at by none: a compilation
            # cache must be keyed on the toolchain that filled it, so only the
            # step knows a safe path under here.
            - name: jax-cache
              mountPath: /cache/jax
            - name: hf-cache
              mountPath: /cache/hf/hub
      volumes:
        # Backing store for the gcsfuse file cache. Without it the sidecar falls
        # back to 5GiB of ephemeral storage and fileCacheCapacity becomes a
        # cheque it cannot cash, refetching checkpoints on every load. Sized by
        # the launcher from the host.
        - name: gke-gcsfuse-cache
          emptyDir:
            medium: Memory
        # JAX and vLLM use shared memory heavily; the 64MB default is far too
        # small and fails in ways that look like unrelated crashes. Sized by
        # the launcher from the host, like the cache above and for the same
        # reason - what needs the room is one engine per chip.
        - name: dshm
          emptyDir:
            medium: Memory
        # The buckets are regional, so these claims resolve at mount time in
        # whichever cluster MultiKueue landed the pod. Defined, with their
        # mount options and cache capacities, in cache_volumes.yaml.tpl - the
        # JobSets a repo passes as --manifest claim the same names.
        - name: jax-cache
          persistentVolumeClaim:
            claimName: jax-cache
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
