# What this fleet gives a workload's pods: the caches, the gcsfuse settings that
# make them mount, and the eviction policy that keeps a running one alive.
#
# A manifest opts in with `tpu-ci.google.com/defaults: standard` on its
# top-level metadata and the launcher merges this in; job.yaml opts in the same
# way. It is additive, so a pod keeps any volume, mount path or annotation it
# declares itself.
#
# Split by what each part depends on: everyPod has no dependency on the
# hardware; tpuPods and tpuJobs apply only to roles holding chips, because the
# caches are sized from a TPU host's memory and the retry rules are about TPU
# nodes being repaired.
#
# What a manifest still states for itself is the hardware it wants - nodeSelector
# and the google.com/tpu count, which together are how the launcher picks the
# queue - and anything genuinely its own, like its deadline.
#
# This is the fleet's contract with every repo, not one Job's configuration:
# changing it changes every workload in tpu-inference and vllm-torchtpu.

# Applied to every pod of a workload that opts in, chips or not.
everyPod:
  annotations:
    # Job pods are evictable by default, so the last long step of a build is a
    # lone pod on an idle node - what OPTIMIZE_UTILIZATION consolidates away.
    # It presents as a job that vanished. A chipless proxy or benchmark client
    # is no different: consolidate one away and the run ends with it.
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

# Applied only to pods that hold chips.
tpuPods:
  annotations:
    # Without this GKE does not inject the sidecar and the claims below never
    # mount.
    gke-gcsfuse/volumes: "true"
    # Headroom for metadata prefetch on both mounts. GKE's guidance is 512Mi or
    # higher; 2Gi because the compilation cache prefix holds tens of thousands of
    # entries and a prefetch that runs out of memory falls back to a lookup per
    # miss.
    gke-gcsfuse/metadata-prefetch-memory-limit: "2Gi"
    # Unlimited sidecar CPU and memory: parallel downloads are CPU-bound and the
    # defaults throttle them. Standard clusters only.
    gke-gcsfuse/cpu-limit: "0"
    gke-gcsfuse/memory-limit: "0"

  volumes:
    # Backing store for the gcsfuse file cache. Without it the sidecar falls back
    # to 5GiB of ephemeral storage and fileCacheCapacity becomes a cheque it
    # cannot cash, refetching checkpoints on every load. Sized by the launcher
    # from the host.
    - name: gke-gcsfuse-cache
      emptyDir:
        medium: Memory
    # JAX and vLLM use shared memory heavily; the 64MB default is far too small
    # and fails in ways that look like unrelated crashes. Sized by the launcher
    # from the host, like the cache above and for the same reason - what needs
    # the room is one engine per chip.
    - name: dshm
      emptyDir:
        medium: Memory
    # The buckets are regional, so these claims resolve at mount time in whichever
    # cluster MultiKueue landed the pod. Defined, with their mount options and
    # cache capacities, in cache_volumes.yaml.tpl.
    - name: jax-cache
      persistentVolumeClaim:
        claimName: jax-cache
    - name: hf-cache
      persistentVolumeClaim:
        claimName: hf-cache

  # Merged into the container named `workload`. Applied ahead of a pod's own
  # mounts, so one nested inside a cache here - vllm-torchtpu's profile cache
  # under /cache/jax - lands inside the mount it shadows rather than under it.
  volumeMounts:
    - name: dshm
      mountPath: /dev/shm
    # Mounted for every workload, pointed at by none: a compilation cache must be
    # keyed on the toolchain that filled it, so only the step knows a safe path
    # under here.
    - name: jax-cache
      mountPath: /cache/jax
    - name: hf-cache
      mountPath: /cache/hf/hub

  # Merged into the pod spec.
  spec:
    restartPolicy: Never
    # The identity the cache buckets authorise; see workload_sa.yaml.tpl for why
    # it is not `default`. validate() rejects any name the fleet has not
    # allowed, so this is the value that name check expects.
    serviceAccountName: tpu-workload
    # TPU nodes are tainted. Without this a pod that asks for chips is never
    # scheduled onto the node that has them.
    tolerations:
      - key: "google.com/tpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"

  # Merged into the container named `workload`. Only what is the same for every
  # workload on the fleet; anything a test needs arrives through --env.
  env:
    - name: HF_HOME
      value: /cache/hf
    # Unbuffered, so output reaches the log as it happens.
    - name: PYTHONUNBUFFERED
      value: "1"

# Merged into the Job of each role that holds chips.
tpuJobs:
  # A TPU node repaired underneath a running pod is rejected at kubelet
  # admission - `no healthy devices present; cannot allocate unhealthy devices
  # google.com/tpu` - with no DisruptionTarget condition and no exit code,
  # because nothing started. Six is a little over ten minutes of exponential
  # backoff, which outlasts a repair.
  #
  # It never reruns a red test: FailJob below ends the Job on the first non-zero
  # exit however many retries remain.
  backoffLimit: 6
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailJob
        onExitCodes:
          containerName: workload
          operator: NotIn
          values: [0]

# Merged into the submitted object itself.
workload:
  # Long enough for the launcher's last log poll after the pods exit.
  ttlSecondsAfterFinished: 300
