# The Job a step gets for --prewarm: start the build's image on a worker, on a
# node that costs no chips, and exit.
#
# GKE Image Streaming converts an image once per digest and every node after the
# first mounts the result in seconds. The CI image is built per commit, so that
# first conversion is paid by whichever TPU pod happens to schedule first - 80
# to 120 seconds on measured builds, against 12 to 45 once converted. Running
# any pod on the digest pays it, and this one asks for no accelerator, so the
# conversion happens beside the tests rather than inside the first of them.
#
# The queue comes from --machine-type and --topology, which is how this lands in
# the region whose nodes are about to want the image. It holds no chips, and the
# queues put google.com/tpu alone under quota, so it is admitted immediately
# rather than waiting behind the work it exists to speed up.
apiVersion: batch/v1
kind: Job
spec:
  parallelism: 1
  completions: 1
  # A prewarm that fails has cost the build nothing but itself: the tests still
  # run, they just pay the conversion the way they did before. So one attempt,
  # not the built-in Job's three - a retry would spend more wall clock than the
  # miss it is insuring against.
  backoffLimit: 0
  # Its own, rather than the shape's three-hour default. This pod runs one
  # command that returns immediately; everything before that is the image
  # arriving, and an image that has not arrived in ten minutes is a fault to
  # report, not to keep waiting on.
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      # The same identity the tests run as. Nothing here reads a bucket, but the
      # namespace publishes this one for workloads and a Job may not pick
      # another; see workload_sa.yaml.tpl.
      serviceAccountName: tpu-workload
      # No TPU selectors and no toleration for the TPU taint, which is what
      # keeps this off a chip-holding node. worker-cpu creates a node sized to
      # the requests below and streams images onto it the same way the TPU pools
      # do - see compute_class_worker.yaml.tpl.
      nodeSelector:
        cloud.google.com/compute-class: worker-cpu
      containers:
        - name: workload
          image: ${IMAGE}
          # Reading the entrypoint is the point: the container has to start for
          # the digest to be converted, and starting is all that is asked of it.
          command: ["/bin/true"]
          # Small on purpose. The node exists to pull an image, and the compute
          # class floors it at eight cores regardless, so asking for more would
          # only make the node harder to place.
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
