# The golden compilation cache: a VolumeSnapshot per worker cluster, taken once
# from a disk populated out of GCS. Every test clones its own writable volume
# from it.
#
# The snapshot is the artifact, not a volume. A shared read-only volume cannot
# accept the entries a test compiles, so every test would keep recompiling
# whatever the golden copy happens to lack, and the cache would only ever get
# staler. A clone per test is writable, so a test reads warm and writes locally,
# and pod_entrypoint.sh pushes the new entries to GCS on success - which is what
# the next refresh of this snapshot picks up.
#
# Applied into a worker cluster, not the manager. MultiKueue copies the Job it
# manages and nothing else.
#
# Substitutions: ${NAMESPACE} ${CACHE_SIZE} ${CACHE_GSA} ${GCS_CACHE_PATH}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: tpu-cache
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-balanced
# Clones are per-test and worthless once the test ends; the snapshot is what
# persists, and it outlives any volume.
reclaimPolicy: Delete
# A Persistent Disk is zonal, so the disk cannot be created until the zone is
# known. Binding earlier can place it where no TPU nodes exist.
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: tpu-cache
driver: pd.csi.storage.gke.io
# Retain, so deleting the scaffolding claim cannot take the snapshot with it.
deletionPolicy: Retain
---
# Scaffolding. The populate job writes through this claim; once the snapshot is
# taken it is deleted, and the snapshot stands alone.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tpu-cache-populate
  namespace: ${NAMESPACE}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: tpu-cache
  resources:
    requests:
      storage: ${CACHE_SIZE}
---
# Identity for the populate job. Workload Identity is enforced on the workers,
# so without this annotation the pod authenticates as the cluster's WI pool
# principal and gets 403 on the bucket - which is what a probe of the default
# service account returned.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpu-cache-populate
  namespace: ${NAMESPACE}
  annotations:
    iam.gke.io/gcp-service-account: ${CACHE_GSA}
---
# Fills the disk from the shared bucket. No TPU request: this is a copy, and it
# must not queue against tests for chips.
apiVersion: batch/v1
kind: Job
metadata:
  name: tpu-cache-populate
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: tpu-cache-populate
      containers:
        - name: populate
          image: google/cloud-sdk:slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "identity: $(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
              mkdir -p /cache
              # Same bucket and layout as run_in_docker.sh, so a clone of this
              # disk holds what a bare-metal VM holds on its own disk.
              gcloud storage rsync --recursive --no-clobber \
                --exclude='.*_.gstmp$' \
                "${GCS_CACHE_PATH}" /cache
              echo "populated $(du -sh /cache | cut -f1) across $(find /cache -type f | wc -l) files"
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: tpu-cache-populate
