<!doctype html>
<!--
  The history page. views.py fills the placeholders - a dollar sign and a
  name - with string.Template, so a literal dollar sign here must be doubled.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPU CI kube · History</title>
<link rel="stylesheet" href="static/style.css?v=$assets">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <h1>TPU CI kube</h1>
    <nav class="tabs"><a class="tab" href="./">Overview</a><a class="tab" href="live">Live</a><a class="tab active" href="history">History</a><a class="tab" href="baseline">Baseline</a></nav>
    <span class="when"><time data-ts="$start"></time> – <time data-ts="$end"></time> · one point per $step</span>
  </div>
</header>
<main>
$errors
<div class="card range"><div class="segmented">$presets</div></div>

<div class="section-label">Chip utilization</div>
$cohorts

<div class="section-label">Node autoscaling</div>
<div class="card">$autoscaling</div>

<div class="section-label">Outcomes</div>
<div class="card">$outcomes</div>

<div class="section-label">Queues</div>
$queues

<p class="muted footer">Data as JSON at <a href="api/history$query">api/history$query</a>.</p>
</main>
<script src="static/app.js?v=$assets"></script>
</body>
</html>
