<!doctype html>
<!--
  The capacity page. views.py fills the placeholders - a dollar sign and a
  name - with string.Template, so a literal dollar sign here must be doubled.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPU CI kube · Capacity</title>
<link rel="stylesheet" href="static/style.css?v=$assets">
</head>
<body>
<!-- The hatch fills the charts name: steps waiting for quota, and chips
     admitted onto Spot with no Spot node. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch-demand" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#eef1f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9aa3b2" stroke-width="2"/></pattern>
  <pattern id="hatch-spot" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#fdf5e1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eda100" stroke-width="2"/></pattern>
</defs></svg>
<header class="topbar">
  <div class="inner">
    <h1>TPU CI kube</h1>
    <nav class="tabs"><a class="tab" href="./">Overview</a><a class="tab" href="live">Live</a><a class="tab" href="jobs">Pipelines</a><a class="tab active" href="capacity">Capacity</a><a class="tab" href="migration">Migration</a></nav>
    <span class="when"><time data-ts="$start"></time> – <time data-ts="$end"></time> · one point per $step</span>
  </div>
</header>
<main>
$errors
$period

<div class="section-label">Over a range</div>
<div class="card range"><div class="segmented">$presets</div></div>

$generations

<div class="section-label">Outcomes by pipeline</div>
<div class="card">$pipelines</div>

<p class="muted footer">Data as JSON at <a href="api/history$query">api/history$query</a>.</p>
</main>
<script src="static/app.js?v=$assets"></script>
</body>
</html>
