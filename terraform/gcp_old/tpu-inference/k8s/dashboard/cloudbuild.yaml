# Builds the queue dashboard image. Run by hand, not on a trigger, and bump
# _REVISION with every change to app.py or the Dockerfile, so a tag always names
# one set of bytes; then set dashboard_image in prod.auto.tfvars to match.
#
#   gcloud builds submit --project cloud-ullm-inference-ci-cd --region us-central1 \
#     --config cloudbuild.yaml \
#     --gcs-source-staging-dir gs://cloud-ullm-inference-ci-cd-tf-state/cloudbuild-source \
#     --substitutions _REVISION=6 .
#
# The staging directory has to be named: the default is a multi-region `us`
# bucket, which constraints/gcp.resourceLocations refuses in this org.
substitutions:
  _REVISION: "6"
  _IMAGE: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/tpu-ci/queue-dashboard

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${_REVISION}
      - .

images:
  - ${_IMAGE}:${_REVISION}

options:
  logging: CLOUD_LOGGING_ONLY
