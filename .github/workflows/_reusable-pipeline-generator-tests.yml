name: Reusable pipeline generator tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    if: github.repository_owner == 'vllm-project' && github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, vllm-runners]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ./buildkite/pipeline_generator

      - name: Check installed generator
        run: python -I -c 'import runtime_shard, runtime_shard_plugin, runtime_shard_coverage'

      - name: Run tests
        run: python -m pytest buildkite/tests
