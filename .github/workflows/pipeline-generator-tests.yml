name: Pipeline generator tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/pipeline-generator-tests.yml"
      - ".buildkite/pipelines/rebuild-cpu-ami.yml"
      - "packer/agent/install-agent.sh"
      - "buildkite/pipeline_generator/**"
      - "buildkite/tests/**"
      - "buildkite/bootstrap-amd.sh"
      - "buildkite/test-template-amd.j2"
      - "buildkite/ci_selector/recorders/**"
      - "pyproject.toml"
      - "requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: github.repository == 'vllm-project/ci-infra'
    uses: vllm-project/ci-infra/.github/workflows/_reusable-pipeline-generator-tests.yml@main
