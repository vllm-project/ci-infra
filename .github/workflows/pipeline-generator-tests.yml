name: Pipeline generator tests

on:
  pull_request:
    paths:
      # test_uv_pin.py reads each of these, so each has to be able to run it.
      - ".github/workflows/*.yml"
      - "buildkite/pipeline_generator/**"
      - "buildkite/tests/**"
      - "buildkite/ci_selector/recorders/**"
      - "buildkite/ci_selector/pyproject.toml"
      - "buildkite/*.sh"
      - "buildkite/pyproject.toml"
      - "buildkite/uv.lock"
      - "buildkite/.python-version"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, vllm-runners]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # The uv bootstrap.sh pins. No python-version: it sets
          # UV_PYTHON, which overrides buildkite/.python-version.
          version: "0.12.15"

      - name: Install test dependencies
        working-directory: buildkite
        run: uv sync --locked --all-packages

      - name: Run tests
        run: buildkite/.venv/bin/pytest buildkite/tests
