# Vocabulary local to this tool. typos resolves its config by walking up from
# each file, so this applies to ci_selector and to nothing else in the repo.
[default.extend-identifiers]
# "literals", not a misspelling of "list". Renaming it collides with the real
# `literals` already in scope in dispatch.py and keys.py.
lits = "lits"

[default.extend-words]
# From "café" in the non-UTF8 fixtures: a latin-1 source file, an undecodable
# shell script, and git's C-quoted filename all have to degrade, not crash.
caf = "caf"
