# Workspace root for the tools bootstrap installs.
# No [tool.pytest.ini_options] or [tool.ruff]: a table here would re-root
# everything under buildkite/ that has no nearer config.
[project]
name = "vllm-ci-buildkite"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipeline_generator", "ci_selector"]
