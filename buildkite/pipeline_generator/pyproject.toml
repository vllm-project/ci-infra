[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-generator"
version = "0.1.0"
dependencies = [
    "pyyaml",
    "click",
    "pydantic>=2.0",
    "requests",
]

[project.scripts]
pipeline-generator = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "pipeline_generator",
    "buildkite_step",
    "step",
    "utils",
    "global_config",
    "constants",
    "recorder_switches",
    "amd",
    "runtime_shard",
    "runtime_shard_plugin",
    "unblock_jobs",
    "selector_gate",
    "queue_fallbacks",
    "queue_health",
]

[tool.setuptools.packages.find]
include = [".", "fallback_rules", "otel_helpers", "plugin", "utils_lib"]

[tool.setuptools.package-data]
otel_helpers = ["*.sh"]
