[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-generator"
version = "0.1.0"
dependencies = [
    "boto3>=1.36.0,<2",
    "botocore>=1.36.26,<2",
    "pyyaml",
    "click",
    "pydantic>=2.0",
    "requests",
]

[project.scripts]
pipeline-generator = "main:main"
vllm-test-selection = "test_selection.cli:main"

[tool.setuptools]
py-modules = [
    "main",
    "pipeline_generator",
    "buildkite_step",
    "step",
    "utils",
    "global_config",
    "constants",
    "amd",
]

[tool.setuptools.packages.find]
include = [".", "otel_helpers", "plugin", "test_selection*", "utils_lib"]

[tool.setuptools.package-data]
otel_helpers = ["*.sh"]
"test_selection.collector" = ["*.sh", "worktree-baseline-*.json"]
