[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-nightly-perf-automation"
version = "0.1.0"
description = "Trigger vLLM nightly perf-eval runs and report rolling regressions"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
]

[project.scripts]
vllm-nightly-perf = "vllm_perf_eval:main"

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.8",
]

[tool.setuptools]
py-modules = ["vllm_perf_eval"]
package-dir = {"" = "scripts"}

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["scripts"]
