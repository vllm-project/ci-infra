# Self-contained demo of the mkexec.sh resolver path, with no TPU required.
#
# Creates a CPU-only queue that rides the SAME MultiKueue admission check as
# the v6e queues, so a job submitted to the manager is dispatched to a worker
# exactly as a real TPU job would be.
#
#   MANAGER=gke_cloud-ullm-inference-ci-cd_us-central1_tpu-ci-manager
#   WORKER=connectgateway_cloud-ullm-inference-ci-cd_global_tpu-ci-southamerica-west1-a
#
#   # the worker copy must omit the admission check (workers run plain Kueue)
#   kubectl --context=$MANAGER apply -f mkexec-demo.yaml
#   kubectl --context=$WORKER  apply -f mkexec-demo.yaml --prune-allowlist= \
#     -o yaml --dry-run=client >/dev/null   # see note below
#
# Simplest path: apply the whole file to the manager, and apply it to the
# worker after deleting the admissionChecksStrategy block. Then:
#
#   kubectl --context=$MANAGER apply -f - <<<"$(sed -n '/^# --- job/,$p' mkexec-demo.yaml)"
#   ./mkexec.sh mkexec-demo -- sh -c 'cat /etc/hostname'
#
# Teardown: kubectl delete -f mkexec-demo.yaml on both, after deleting the job
# on the manager (MultiKueue garbage-collects the worker copy).
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: demo-cpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: demo-cpu
spec:
  # Delete this block for the worker-cluster copy.
  admissionChecksStrategy:
    admissionChecks:
    - name: v6e-multikueue-dispatch
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: buildkite
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: demo-cpu
      resources:
      - name: cpu
        nominalQuota: "4"
      - name: memory
        nominalQuota: 8Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: demo-cpu
  namespace: buildkite
spec:
  clusterQueue: demo-cpu
  stopPolicy: None
# --- job (submit to the manager only) ---
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mkexec-demo
  namespace: buildkite
  labels:
    kueue.x-k8s.io/queue-name: demo-cpu
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: alpine:3.20
        command: ["sh", "-c", "echo started on $(hostname); sleep 1800"]
        resources:
          requests:
            cpu: "200m"
            memory: 256Mi
